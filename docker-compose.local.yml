services:
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.33.3}
    restart: unless-stopped
    ports:
      - "${N8N_LOCAL_PORT:-43222}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      WEBHOOK_URL: http://localhost:${N8N_LOCAL_PORT:-43222}/
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_LOCAL_PORT:-43222}/
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      PANDU_SHARED_SECRET: ${PANDU_SHARED_SECRET}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-168}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Dhaka}
      TZ: ${TZ:-Asia/Dhaka}
    volumes:
      - pandu_n8n_local_data:/home/node/.n8n
    security_opt:
      - no-new-privileges:true

volumes:
  pandu_n8n_local_data:
